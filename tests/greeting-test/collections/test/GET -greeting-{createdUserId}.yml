info:
  name: GET /greeting/{createdUserId}
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/greeting/{{createdUserId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Статус 200 для GET /greeting/{createdUserId}", function() {
          expect(res.status).to.equal(200);
        });

        test("Ответ содержит корректные name и surname (path)", function() {
          const data = res.body;

          const testName = bru.getEnvVar("testName");
          const testSurname = bru.getEnvVar("testSurname");

          expect(data).to.have.property("name");
          expect(data).to.have.property("surname");

          expect(data.name).to.equal(testName);
          expect(data.surname).to.equal(testSurname);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
