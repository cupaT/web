info:
  name: GET /greeting (main)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/greeting"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Статус 200 для GET /greeting без id", function() {
          expect(res.status).to.equal(200);
        });

        test("Ответ содержит поле text", function() {
          const data = res.body;
          expect(data).to.have.property("text");
          expect(data.text).to.be.a("string");
          expect(data.text.length).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
